# New-content sample: a 15 s 9:16 reel built only from reelforge templates + raw footage + a supplied voice-over.
# It exercises every module: footage ingest/trim, take scoring, arrangement, voice + captions, auto SFX cues,
# click ducks, chat camera, kinetic type, cards with cursor, end card, portrait render, mastering, audit.
name: demo-portrait

canvas: {width: 1080, height: 1920, fps: 30, motion_blur: true}

references:
  - src: ../showreel/refs/ref.mp4

footage:
  - id: reel
    src: ../../../video-reel/renders/hirecrew_reel_15s.mp4   # our earlier 15 s reel, used as "raw footage"
    trim: [5.0, 8.0]

scenes:
  - id: hook
    type: chat
    duration: 3.6
    step: 0.5
    groups:
      - who: AI agent
        avatar: AI
        messages:
          - {side: out, text: "Did you fill my Sheet?", time: "10:02"}
          - {side: in, text: "Done!", time: "10:41"}
          - {side: out, text: "it's empty.", time: "10:43", big: true}
  - id: meet
    type: footage
    video: reel
    duration: 2.0
    entry: flash
    exit: whip-left
    caption_pos: center                    # keep the title clear of the voice captions at the bottom
    lines: [{text: "Meet [HireCrew.]", size: 110}]
  - id: order
    type: kinetic
    world: light
    duration: 1.6
    entry: whip-left
    exit: whip-left
    tiles: [mail, grid, doc, chat]
    lines:
      - {text: "Order in", size: 150}
      - {text: "[plain words.]", size: 150}
  - id: held
    type: card
    world: dark
    duration: 2.0
    entry: whip-left
    exit: up
    heading: "Payment's [held.]"
    card:
      title: "Checkout"
      icon: assets/brand/hirecrew-icon.png
      amount: "$5.00"
      rows:
        - {label: "Until you accept", state: held, icon: check}
  - id: verify
    type: card
    world: light
    duration: 1.8
    entry: push-up
    exit: whip-right
    heading: "You [verify.]"
    card:
      title: "Inbox-to-Sheet · delivered"
      icon: HC
      subtitle: "Happy with the result?"
      buttons: ["Dispute", "Accept · pay"]
      hover: 0
      click: 1
      result: Released
  - id: crew
    type: card
    world: dark
    duration: 1.6
    entry: whip-right
    exit: blur
    heading: "Or hire a [crew.]"
    card:
      subtitle: "Hard cap $20.00"
      rows:
        - {label: "Research", value: "$4.00", state: released}
        - {label: "Copy", value: "$3.00", state: held}
        - {label: "Test pack", value: "$2.50", state: refunded, strike: true}
  - id: end
    type: endcard
    world: light
    duration: 4.5
    type_text: "This is"
    logo: assets/brand/hirecrew-logo-trim.png
    tagline: "Pay only for [finished work.]"
    cta: "Join HireCrew →"

music:
  mode: take
  takes_dir: ../showreel/assets/music      # the scorer picks the best of the six original MusicGen takes
  arrange: {bpm: 124, drop: 3.6, intro_lowpass: true}
  volume: 0.85
  volume_under_voice: 0.22

voice:
  mode: file
  file: assets/voice/vo.wav                # HeyGen "Joelle" track from the 15 s reel (words timed by HeyGen)
  words: assets/voice/words.json
  start: 0.0

captions: {enabled: true, max_words: 4, size: 38, bottom: 150}

render: {resolution: portrait, quality: delivery, gpu: true}
