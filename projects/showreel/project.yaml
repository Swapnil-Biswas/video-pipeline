# The original HireCrew showreel (video-showreel/), reproduced by reelforge.
# Scenes are the hand-authored compositions (type: file); music is the MusicGen take used in the final;
# the 79 sound cues and 3 click ducks are copied from video-showreel/tools/audio.py.
name: showreel

canvas: {width: 1920, height: 1080, fps: 60, motion_blur: true}

references:
  - src: refs/ref.mp4          # https://www.instagram.com/reel/Dd7LoTKSsbT/ (Aiden | Motion Designer), analysis only

scenes:
  - {id: chat, type: file, src: scenes/chat.html, duration: 9.0}
  - {id: title, type: file, src: scenes/title.html, duration: 1.6}
  - {id: order, type: file, src: scenes/order.html, duration: 1.8}
  - {id: held, type: file, src: scenes/held.html, duration: 1.4}
  - {id: gate, type: file, src: scenes/gate.html, duration: 1.4}
  - {id: sheet, type: file, src: scenes/sheet.html, duration: 1.6}
  - {id: choice, type: file, src: scenes/choice.html, duration: 1.6}
  - {id: paid, type: file, src: scenes/paid.html, duration: 2.0}
  - {id: crew, type: file, src: scenes/crew.html, duration: 2.0}
  - {id: end, type: file, src: scenes/end.html, duration: 5.6}

music:
  mode: take
  take: assets/music/clip_musicgen-stereo-medium_404_p1.wav   # original choice (score.py rejected 303 for a dropout)
  # takes_dir: assets/music      # or: let the scorer pick among all six original takes
  arrange: {bpm: 124, drop: 9.0, intro_lowpass: true}
  volume: 0.85
  duck_at: [11.9, 17.94, 25.72]

