# reelforge project. Every key not set here comes from config/defaults.yaml.
# Paths are relative to this folder (or to the pipeline root, e.g. assets/brand/...).
name: {{name}}

canvas: {width: {{w}}, height: {{h}}, fps: 60, motion_blur: true}

references: []
#  - url: https://www.instagram.com/reel/XXXX/      # downloaded with yt-dlp, analysed (cuts, tempo, contact sheets)
#  - src: refs/reference.mp4

footage: []
#  - {id: clip1, src: assets/footage/raw.mp4, trim: [2.0, 6.5]}

# Talking-head footage: list it above, set aroll.video to its id and keep scenes: auto.
aroll: {video: null}
transcribe: {enabled: true}
scenes: auto
captions: {enabled: true}

music:
  mode: generate            # none | file | take | generate (MusicGen on the GPU)
  generate: {prompts_key: showreel, seeds: [101, 202, 303]}
  arrange: {bpm: null, drop: 0, intro_lowpass: false}

voice: {mode: none}

# Persistent @handle / logo watermark over every frame (optional).
# brand:
#   watermark: {text: "@yourhandle", position: bottom-right, opacity: 0.8, size: 30}

render: {resolution: {{res}}, quality: delivery, gpu: true}
