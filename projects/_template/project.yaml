# reelforge project. Every key not set here comes from config/defaults.yaml.
# Paths are relative to this folder (or to the pipeline root, e.g. assets/brand/...).
name: {{name}}

canvas: {width: {{w}}, height: {{h}}, fps: 60, motion_blur: true}

references: []
#  - url: https://www.instagram.com/reel/XXXX/      # downloaded with yt-dlp, analysed (cuts, tempo, contact sheets)
#  - src: refs/reference.mp4

footage: []
#  - {id: clip1, src: assets/footage/raw.mp4, trim: [2.0, 6.5]}

# Scene types: chat | kinetic | card | endcard | footage | file (your own HyperFrames composition)
# Text in [brackets] becomes the accent pill.  entry: flash|whip-left|whip-right|push-up|blur|none
# exit: whip-left|whip-right|up|blur|zoom|flash|none
scenes:
  - id: hook
    type: chat
    duration: 4.0
    groups:
      - who: AI agent
        avatar: AI
        messages:
          - {side: out, text: "Can you do the thing?"}
          - {side: in, text: "Done!"}
          - {side: out, text: "IT ACTUALLY WORKED", big: true}
  - id: title
    type: kinetic
    world: light
    duration: 1.6
    entry: flash
    exit: blur
    tiles: [mail, grid, doc, chat]
    lines:
      - {text: "Your product.", size: 68, tone: muted}
      - {text: "One [big promise.]", size: 150}
  - id: end
    type: endcard
    duration: 4.0
    type_text: "This is"
    logo: assets/brand/hirecrew-logo-trim.png
    tagline: "Your [tagline.]"
    cta: "Get started →"

music:
  mode: generate            # none | file | take | generate (MusicGen on the GPU)
  generate: {prompts_key: showreel, seeds: [101, 202, 303]}
  arrange: {bpm: 124, drop: 4.0}

voice: {mode: none}
captions: {enabled: false}

render: {resolution: {{res}}, quality: delivery, gpu: true}
